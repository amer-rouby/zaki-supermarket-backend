spring.application.name=zaki-supermarket-backend
server.port=8082
spring.jpa.properties.hibernate.default_schema=zaki_supermarket

# Database connection - must be supplied via environment variables, no secrets committed here.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=ZakiSupermarketPool
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.isolate-internal-queries=true
spring.datasource.hikari.register-mbeans=true

# JWT - secret must be supplied via environment variable, no default. Generate with e.g.
# `openssl rand -base64 64` and keep it out of source control.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
logging.level.com.zakisupermarket=INFO
logging.level.org.springframework.security=WARN
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload-dir=${user.dir}/uploads/profiles/

# CORS - comma-separated list of allowed frontend origins. Override per environment;
# there is no wildcard/catch-all default since allowCredentials is enabled below.
# localhost:8100 = Ionic mobile app's dev server (ionic/ng serve). capacitor://localhost
# and https://localhost are the origins Capacitor's WebView actually sends once the
# mobile app is built and installed as a real native app (iOS and Android
# respectively - Capacitor 3+ defaults androidScheme to https, not http).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4202,http://localhost:3000,http://localhost:8080,http://localhost:8100,capacitor://localhost,http://localhost,https://localhost,http://192.168.0.204:8100}

# Platform-operator-only key (X-Platform-Admin-Key header) for whole-database
# backup/restore, gating /api/platform/**. Set to a long random value in real
# deployments - blank/unset means those endpoints refuse everyone (fail closed),
# not that they're open. Never share this with pharmacy customers/admins.
platform.admin-api-key=${PLATFORM_ADMIN_API_KEY:}

# WhatsApp Cloud API Configuration
# Get these from Meta Developer Portal: https://developers.facebook.com/
# Must be supplied via environment variables - never commit a real access token.
whatsapp.api.base-url=https://graph.facebook.com/v18.0
whatsapp.api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.api.access-token=${WHATSAPP_ACCESS_TOKEN:}

# Egyptian Tax Authority (ETA) e-invoice credentials - see docs/eta-integration.md.
# Blank until an operator supplies real values; the NoopEtaProvider reports a
# clear "not configured" error rather than a fake success while these are empty.
eta.client-id=${ETA_CLIENT_ID:}
eta.client-secret=${ETA_CLIENT_SECRET:}
eta.environment=${ETA_ENVIRONMENT:sandbox}

# Outgoing SMTP for supplier-facing emails (e.g. "send purchase order by email").
# Blank credentials mean sending fails closed with a clear error rather than
# silently no-op'ing - set real values via environment variables per deployment.
# For Gmail: use an App Password (not the account password), requires 2FA enabled
# on the Google account first.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
mail.from-address=${MAIL_FROM:${spring.mail.username:}}
