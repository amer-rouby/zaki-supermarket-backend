# Production overrides.
# DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, WHATSAPP_PHONE_NUMBER_ID,
# WHATSAPP_ACCESS_TOKEN and CORS_ALLOWED_ORIGINS must be set as real environment
# variables in the deployment environment (container/host secrets manager) - there are
# no defaults here on purpose, so the app fails fast at startup instead of silently
# running with dev-only settings.
# CORS_ALLOWED_ORIGINS has no fallback here (unlike the base properties file), so a
# production deploy that forgets to set it fails to start instead of silently only
# allowing localhost (which would just look like a broken frontend) or nothing at all.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.com.zakisupermarket=INFO
logging.level.org.springframework.security=WARN
