# Development overrides
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.com.zakisupermarket=DEBUG

# Local-dev-only fallback defaults so `mvn spring-boot:run -Dspring-boot.run.profiles=dev`
# works out of the box against a local Postgres without extra setup. Override with real
# environment variables for anything beyond a throwaway local database. Never rely on
# these defaults outside a developer's own machine.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zaki_supermarket_dev}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-production-change-me-1234567890}